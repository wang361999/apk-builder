name: Build APK

on:
  repository_dispatch:
    types: [build_apk]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select template
        id: select_template
        env:
          TEMPLATE: ${{ github.event.client_payload.template }}
        run: |
          # 确定使用哪套模板，默认 standard
          TEMPLATE="${TEMPLATE:-standard}"
          TEMPLATE_DIR="android/templates/template-${TEMPLATE}"
          
          echo "Using template: $TEMPLATE"
          echo "Template directory: $TEMPLATE_DIR"
          
          # 检查模板目录是否存在
          if [ ! -d "$TEMPLATE_DIR" ]; then
            echo "ERROR: Template directory $TEMPLATE_DIR does not exist!"
            echo "Available templates:"
            ls -la android/templates/
            exit 1
          fi
          
          echo "=== Template contents ==="
          find "$TEMPLATE_DIR" -type f | head -30
          
          echo "template_dir=$TEMPLATE_DIR" >> $GITHUB_OUTPUT
          echo "template_name=$TEMPLATE" >> $GITHUB_OUTPUT

      - name: Verify template structure
        env:
          TEMPLATE_DIR: ${{ steps.select_template.outputs.template_dir }}
        run: |
          echo "=== Checking template: $TEMPLATE_DIR ==="
          ls -la "$TEMPLATE_DIR/"
          echo "=== Checking gradlew ==="
          ls -la "$TEMPLATE_DIR/gradlew"
          file "$TEMPLATE_DIR/gradlew"
          echo "=== Checking gradle-wrapper.jar ==="
          ls -la "$TEMPLATE_DIR/gradle/wrapper/gradle-wrapper.jar"
          echo "=== Checking app directory ==="
          ls -la "$TEMPLATE_DIR/app/"
          echo "=== Checking Java files ==="
          find "$TEMPLATE_DIR/app/src" -name "*.java" -type f

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        env:
          TEMPLATE_DIR: ${{ steps.select_template.outputs.template_dir }}
          KEYSTORE_PASSWORD: ${{ github.event.client_payload.keystore_password || 'android' }}
          KEY_ALIAS: apk-builder
          KEY_PASSWORD: ${{ github.event.client_payload.keystore_password || 'android' }}
        run: |
          cd "$TEMPLATE_DIR"
          keytool -genkey -v \
            -keystore app/keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias apk-builder \
            -dname "CN=APK Builder, OU=Dev, O=App, L=City, ST=State, C=CN" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD"

      - name: Prepare Android project
        env:
          TEMPLATE_DIR: ${{ steps.select_template.outputs.template_dir }}
          APP_URL: ${{ github.event.client_payload.url }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          VERCEL_URL: ${{ github.event.client_payload.vercel_url }}
        run: |
          set -x
          cd "$TEMPLATE_DIR"

          # Replace package name in all source files
          NEW_PACKAGE_DIR="${PACKAGE_NAME//.//}"
          echo "New package dir: $NEW_PACKAGE_DIR"

          # Find and replace in source files
          find app/src/main/java -type f -name "*.java" | while read f; do
            sed -i "s|com\.webview\.app|${PACKAGE_NAME}|g" "$f"
            echo "Replaced package in: $f"
          done

          # Rename directory structure
          mkdir -p "app/src/main/java/${NEW_PACKAGE_DIR}"
          find app/src/main/java/com/webview/app -type f -exec mv {} "app/src/main/java/${NEW_PACKAGE_DIR}/" \;
          rm -rf app/src/main/java/com/webview

          # Verify the move worked
          echo "=== Files after move ==="
          find app/src/main/java -type f -name "*.java"

          # Update package name in build.gradle
          sed -i "s|applicationId \"com.webview.app\"|applicationId \"${PACKAGE_NAME}\"|g" app/build.gradle
          sed -i "s|namespace \"com.webview.app\"|namespace \"${PACKAGE_NAME}\"|g" app/build.gradle

          # Update app name in strings.xml
          sed -i "s|<string name=\"app_name\">WebView App</string>|<string name=\"app_name\">${APP_NAME}</string>|g" app/src/main/res/values/strings.xml

          # Update URL in MainActivity (user's website URL)
          sed -i "s|https://example.com|${APP_URL}|g" "app/src/main/java/${NEW_PACKAGE_DIR}/MainActivity.java"

          # Replace ProGuard rules package name
          sed -i "s|com\.webview\.app|${PACKAGE_NAME}|g" app/proguard-rules.pro

          # Replace CONFIG_URL with the actual vercel_url (remote config endpoint)
          CLEAN_VERCEL_URL="${VERCEL_URL%/}"
          sed -i "s|https://your-domain.com|${CLEAN_VERCEL_URL}|g" "app/src/main/java/${NEW_PACKAGE_DIR}/MainActivity.java"

          # Verify build.gradle
          echo "=== build.gradle after changes ==="
          cat app/build.gradle

          # Verify strings.xml
          echo "=== strings.xml after changes ==="
          cat app/src/main/res/values/strings.xml

          echo "BUILD_ID=${BUILD_ID}" >> $GITHUB_ENV

      - name: Build APK
        env:
          TEMPLATE_DIR: ${{ steps.select_template.outputs.template_dir }}
          KEYSTORE_PASSWORD: ${{ github.event.client_payload.keystore_password || 'android' }}
          KEY_ALIAS: apk-builder
          KEY_PASSWORD: ${{ github.event.client_payload.keystore_password || 'android' }}
        run: |
          cd "$TEMPLATE_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Get APK info
        id: apk_info
        env:
          TEMPLATE_DIR: ${{ steps.select_template.outputs.template_dir }}
        run: |
          echo "=== Looking for APK files ==="
          find "$TEMPLATE_DIR/app/build/outputs" -name "*.apk" -type f || true
          
          APK_PATH=$(find "$TEMPLATE_DIR/app/build/outputs" -name "*.apk" -type f | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK file found!"
            exit 1
          fi
          
          APK_NAME=$(basename "$APK_PATH")
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "Found APK: $APK_PATH"
          echo "APK name: $APK_NAME"
          echo "APK size: $APK_SIZE bytes"
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_size=${APK_SIZE}" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Releases
        id: upload_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.client_payload.build_id }}
          name: "Build #${{ github.event.client_payload.build_id }}"
          files: ${{ steps.apk_info.outputs.apk_path }}
          body: |
            Build ID: ${{ github.event.client_payload.build_id }}
            Template: ${{ steps.select_template.outputs.template_name }}
            URL: ${{ github.event.client_payload.url }}
            App Name: ${{ github.event.client_payload.app_name }}
            Package: ${{ github.event.client_payload.package_name }}

      - name: Notify backend (success)
        env:
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          VERCEL_URL: ${{ github.event.client_payload.vercel_url }}
          APK_NAME: ${{ steps.apk_info.outputs.apk_name }}
          APK_SIZE: ${{ steps.apk_info.outputs.apk_size }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          BASE_URL="${VERCEL_URL%/}"
          APK_DOWNLOAD_URL="https://github.com/${GITHUB_REPO}/releases/download/build-${BUILD_ID}/${APK_NAME}"

          echo "APK download URL: ${APK_DOWNLOAD_URL}"

          curl -X PUT "${BASE_URL}/api/build" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
            -d '{
              "buildId": "'"${BUILD_ID}"'",
              "status": "success",
              "downloadUrl": "'"${APK_DOWNLOAD_URL}"'",
              "versionName": "v1.0.0",
              "fileSize": '"${APK_SIZE}"',
              "buildLog": "APK built successfully via GitHub Actions"
            }'

      - name: Notify backend (failure)
        if: failure()
        env:
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          VERCEL_URL: ${{ github.event.client_payload.vercel_url }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          BASE_URL="${VERCEL_URL%/}"

          curl -X PUT "${BASE_URL}/api/build" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
            -d '{
              "buildId": "'"${BUILD_ID}"'",
              "status": "failed",
              "buildLog": "GitHub Actions build failed, check Actions tab for details"
            }'
